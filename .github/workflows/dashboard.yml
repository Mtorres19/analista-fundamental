name: Dashboard

on:
  schedule:
    # GitHub retrasa o descarta los cron en punto (minuto 0); un minuto poco usado se respeta mejor.
    - cron: "23 13-23 * * 1-5"  # cada hora en días hábiles, 7 a 17 h de Ciudad de México
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Revisar series
        run: python -m macro check || true
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
      - name: Generar dashboard
        run: python -m macro dashboard --out site/index.html
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
