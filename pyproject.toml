[project]
name = "analista-fundamental"
version = "0.1.0"
description = "Agente de análisis fundamental: primero el panorama macro (EE.UU., México, mundo), de ahí los supuestos de valuación."
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "requests>=2.32", "pydantic>=2.4", "yfinance>=0.2.40", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["macro", "equity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
